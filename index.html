<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Pizzeria Fornello - Authentic Italian pizzas made with traditional recipes and the freshest ingredients. Order online for pickup or delivery.">
    <title>Pizzeria Fornello - Authentic Italian Pizza</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="text/javascript">
      (function(d, t) {
          var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
          v.onload = function() {
            try {
              window.voiceflow.chat.load({
                verify: { projectID: '68f882de57acbd73f0db6e2a' },
                url: 'https://general-runtime.voiceflow.com',
                versionID: 'production',
                voice: {
                  url: "https://runtime-api.voiceflow.com"
                }
              });

              setTimeout(() => {
                window.voiceflow.chat.proactive.push({
                  type: 'text',
                  payload: {
                    message: "Hey there! I'm Nello, your pizza guide at Fornello"
                  }
                });

                setTimeout(() => {
                  window.voiceflow.chat.proactive.push({
                    type: 'text',
                    payload: {
                      message: "Want a recommendation? Just tell me what flavors you love"
                    }
                  });

                  setTimeout(() => {
                    window.voiceflow.chat.proactive.push({
                      type: 'text',
                      payload: {
                        message: "Or feel free to ask me anything about our menu!"
                      }
                    });
                  }, 4000);

                }, 3000);

              }, 3000);
            } catch (e) {
              console.error("Voiceflow chat failed to load:", e);
            }
          }
          v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs"; v.type = "text/javascript"; s.parentNode.insertBefore(v, s);
      })(document, 'script');
    </script>
</body>

</html>
